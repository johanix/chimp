# sites.yaml — source of truth for (provider, site) → location + tags.
#
# Synced into the ClickHouse table dsc.sites by `chimporter sync-sites`.
# Dashboards LEFT JOIN observations against this table to get country,
# region tags, coordinates, and service type for aggregation and geomap
# rendering.
#
# One entry per physical site. The `service` field distinguishes anycast
# vs unicast sites (a property of the deployment, not of the API feed).
# All sites are currently fetched via the netnod-uni API (v2) — the v1
# netnod-any API is being retired because v2 is expected to return a
# superset of sites once Netnod confirms.
#
# Tags are free-form strings. Sites can belong to multiple tags; queries
# filter with has(tags, 'Nordics'). Typical uses today:
#   - Europe, Asia, Africa, North America, South America, Oceania (continents)
#   - Nordics (Sweden, Norway, Denmark, Finland, Iceland + autonomous)
#
# country_iso is ISO 3166-1 alpha-2 (SE, NO, US, JP, ...). Used for
# choropleth maps.
#
# All sites currently have real locations — no PLACEHOLDER entries.

